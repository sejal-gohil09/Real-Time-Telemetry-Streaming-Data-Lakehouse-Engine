# ===========================================================================
# dbt_ci.yml — GitHub Actions CI/CD Pipeline
# ===========================================================================
# Runs on every push to main and on pull requests.
#
# Pipeline stages:
#   1. Lint: Python code quality (ruff) + SQL lint (sqlfluff)
#   2. Test: dbt deps + dbt run (staging only) + dbt test
#   3. Build: Full dbt run + generate docs + upload artifacts
#
# Secrets required (GitHub repo > Settings > Secrets and variables > Actions):
#   SNOWFLAKE_ACCOUNT      — e.g. xy12345.eu-west-1.aws
#   SNOWFLAKE_USER         — dbt_runner service user
#   SNOWFLAKE_PASSWORD     — service user password
#   SNOWFLAKE_DATABASE     — UK_ENERGY_LAKEHOUSE
#   SNOWFLAKE_WAREHOUSE    — ETL_WH
#   SNOWFLAKE_ROLE         — DBT_ROLE
#
# Author: Sejal Gohil
# ===========================================================================

name: dbt CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'
      - 'python_pipeline/**'
      - '.github/workflows/dbt_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dbt_project/**'
      - 'python_pipeline/**'

env:
  DBT_VERSION: '1.7.0'
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Python + SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff sqlfluff

      - name: Lint Python
        run: ruff check python_pipeline/

      - name: Lint SQL (dbt models)
        run: |
          sqlfluff lint dbt_project/models/ --dialect snowflake
          sqlfluff lint dbt_project/macros/ --dialect snowflake
          sqlfluff lint snowflake_setup/ --dialect snowflake

  # ---------------------------------------------------------------------------
  # Job 2: dbt Test (staging only — fast feedback)
  # ---------------------------------------------------------------------------
  dbt-test:
    name: dbt Run + Test (Staging)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          uk_energy_lakehouse:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                schema: CI_{{ "${{ github.run_id }}" }}
                threads: 4
          EOF

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt run (staging only)
        working-directory: dbt_project
        run: dbt run --select staging --target ci

      - name: dbt test (staging only)
        working-directory: dbt_project
        run: dbt test --select staging --target ci

      - name: dbt clean up CI schema
        if: always()
        working-directory: dbt_project
        run: |
          dbt run-operation drop_ci_schema --target ci || true

  # ---------------------------------------------------------------------------
  # Job 3: dbt Build (full run + docs — on main branch only)
  # ---------------------------------------------------------------------------
  dbt-build:
    name: dbt Build + Docs (Full)
    runs-on: ubuntu-latest
    needs: dbt-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          uk_energy_lakehouse:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                schema: STAGING
                threads: 8
          EOF

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt run (full)
        working-directory: dbt_project
        run: dbt run --target prod

      - name: dbt test (full)
        working-directory: dbt_project
        run: dbt test --target prod

      - name: Generate dbt docs
        working-directory: dbt_project
        run: dbt docs generate --target prod

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt_project/target/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4: Python pipeline smoke test
  # ---------------------------------------------------------------------------
  python-smoke-test:
    name: Python Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — generate meter data
        run: |
          python python_pipeline/generate_meter_data.py \
            --date 2025-01-01 \
            --meters 100 \
            --output-dir ./test_output

      - name: Verify output
        run: |
          ls -lh ./test_output/settlement_date=2025-01-01/
          head -5 ./test_output/settlement_date=2025-01-01/meter_readings.csv
          wc -l ./test_output/settlement_date=2025-01-01/meter_readings.csv
